<details class="account-menu">
    <summary class="user-chip">
        <span class="user-icon"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#user"></use></svg></span>
        <span class="user-name">{{ nombre }}</span>
    </summary>

    <div class="account-panel">
        <form class="account-form" action="/auth/cambiar-password" method="post">
            <strong>Cambiar contraseña</strong>
            <label>Contraseña actual <input name="password_actual" type="password" required></label>
            <label>Nueva contraseña <input name="password_nueva" type="password" minlength="8" required></label>
            <button type="submit" class="account-action">Guardar contraseña</button>
        </form>

        <a href="/auth/logout" class="account-action">Cerrar sesión</a>
        <a href="/usuario/intercambios" class="account-action">Mis intercambios</a>

        <form class="account-form account-delete" action="/auth/eliminar-cuenta" method="post">
            <strong>Eliminar cuenta</strong>
            <label>Confirma tu contraseña <input name="password_actual" type="password" required></label>
            <button type="submit" class="account-action danger">Eliminar mi cuenta</button>
        </form>
    </div>
</details>
